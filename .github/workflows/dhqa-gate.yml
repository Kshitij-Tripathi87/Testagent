name: DataHub Contract QA Gate

on:
  pull_request:
    paths:
      - "models/**"
      - "dags/**"
  workflow_dispatch:
    inputs:
      dataset_urn:
        description: "Dataset URN to check"
        required: true
        default: "urn:li:dataset:(urn:li:dataPlatform:snowflake,orders.fact_orders,PROD)"

jobs:
  contract-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dataset:
          - urn:li:dataset:(urn:li:dataPlatform:snowflake,orders.fact_orders,PROD)
          - urn:li:dataset:(urn:li:dataPlatform:snowflake,orders.stg_orders,PROD)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dhqa and dependencies
        run: |
          pip install -e .
          pip install pyyaml pandas

      - name: Generate local fixtures
        run: python scripts/ingest_local_fixtures.py

      - name: Run contract checks
        id: dhqa_check
        run: |
          python -m dhqa.cli check \
            --dataset "${{ matrix.dataset }}" \
            --local-fixture data/fixtures \
            --output results

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhqa-results-${{ matrix.dataset }}
          path: results/

      - name: Post root cause on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const resultsDir = 'results';
            let traceBody = "The `dhqa check` for `${{ matrix.dataset }}` failed.\n\nRoot cause has been traced via DataHub lineage — see the job artifacts for the full JSON report.\n";
            try {
              const files = fs.existsSync(resultsDir) ? fs.readdirSync(resultsDir).filter(f => f.startsWith('incident_report_') && f.endsWith('.md')) : [];
              if (fs.existsSync(resultsDir) && files.length > 0) {
                const report = fs.readFileSync(path.join(resultsDir, files[0]), 'utf8');
                traceBody = "## DataHub Contract QA Gate: Failure Detected\n\n" + report + "\n\n---\n_Full JSON results available in the job artifacts._";
              }
            } catch (e) { traceBody += "\n_(root-cause report could not be read: " + e.message + ")_"; }
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: traceBody
            });