name: Testagent CI

on:
  push:
    branches:
      - main
      - feature/full-stack-beta-mvp
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,dev]"
      - name: Compile Python sources
        run: python -m compileall -q src tests migrations
      - name: Run Python tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm install
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Production build
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_DEV_USER: ci-test-user
        run: npm run build


  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate application Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password
          APP_ENCRYPTION_KEY: ci-placeholder-only
        run: docker compose -f infra/docker-compose.app.yml config --quiet
