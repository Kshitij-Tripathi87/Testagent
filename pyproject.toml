[project]
name = "dhqa"
version = "0.1.0"
description = "DataHub Contract QA Agent — metadata-aware codegen, test generation, and lineage-based root-causing for DataHub."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
app = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "cryptography>=43",
    "PyJWT[crypto]>=2.9",
    "redis>=5.0",
    "rq>=2.0",
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "streamlit>=1.35",
    "tenacity>=8.0",
    "httpx>=0.27",
]

[project.scripts]
dhqa = "dhqa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: Live DataHub integration tests (require DATAHUB_GMS_URL env var).",
    "e2e: End-to-end application tests.",
]
