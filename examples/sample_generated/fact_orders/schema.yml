version: 2

models:
  - name: fact_orders
    columns:
      - name: id
        tests:
          - not_null
          - unique
          - relationships(to=ref('stg_orders'), field='id')
      - name: customer_id
        tests:
          - not_null
      - name: amount
      - name: order_ts
        tests:
          - not_null
      - name: tax
